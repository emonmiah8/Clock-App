<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<style>
  :root { --color: #ffffff; --size: 18vw; }
  body {
    margin: 0;
    height: 100vh;
    background: #000;
    color: var(--color);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
  }
  #time { font-size: var(--size); font-weight: 200; }
  #date { font-size: 5vw; opacity: 0.6; margin-top: 8px; }

  #gear {
    position: fixed; top: 12px; right: 16px;
    background: none; border: none;
    color: #fff; font-size: 28px; opacity: 0.5;
  }
  #panel {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #151515; color: #fff;
    padding: 16px 20px 28px;
    border-radius: 16px 16px 0 0;
  }
  #panel.open { display: block; }
  .row { margin: 16px 0; }
  .label { font-size: 14px; opacity: 0.6; margin-bottom: 8px; }
  .swatch {
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid #444; margin-right: 10px;
  }
  #size { width: 100%; }
  #format {
    background: #333; color: #fff; border: none;
    padding: 10px 18px; border-radius: 8px; font-size: 16px;
  }
</style>
</head>
<body>
  <div id="time"></div>
  <div id="date"></div>

  <button id="gear">⚙</button>

  <div id="panel">
    <div class="row">
      <div class="label">Color</div>
      <button class="swatch" data-color="#ffffff" style="background:#ffffff"></button>
      <button class="swatch" data-color="#4fc3f7" style="background:#4fc3f7"></button>
      <button class="swatch" data-color="#81c784" style="background:#81c784"></button>
      <button class="swatch" data-color="#ffb74d" style="background:#ffb74d"></button>
      <button class="swatch" data-color="#f06292" style="background:#f06292"></button>
    </div>
    <div class="row">
      <div class="label">Size</div>
      <input type="range" id="size" min="8" max="26" step="1">
    </div>
    <div class="row">
      <div class="label">Time format</div>
      <button id="format"></button>
    </div>
  </div>

<script>
  const defaults = { color: '#ffffff', size: 18, hour12: false };
  let settings = { ...defaults };

  // Load saved settings
  try {
    const saved = localStorage.getItem('clockSettings');
    if (saved) settings = { ...defaults, ...JSON.parse(saved) };
  } catch (e) {}

  function save() {
    try { localStorage.setItem('clockSettings', JSON.stringify(settings)); } catch (e) {}
  }

  function apply() {
    document.documentElement.style.setProperty('--color', settings.color);
    document.documentElement.style.setProperty('--size', settings.size + 'vw');
    document.getElementById('size').value = settings.size;
    document.getElementById('format').textContent =
      settings.hour12 ? '12-hour (tap for 24)' : '24-hour (tap for 12)';
    tick();
  }

  function tick() {
    const now = new Date();
    document.getElementById('time').textContent =
      now.toLocaleTimeString('en-GB', { hour12: settings.hour12 });
    document.getElementById('date').textContent =
      now.toLocaleDateString('en-GB', {
        weekday: 'long', day: 'numeric', month: 'long'
      });
  }

  // Events
  document.getElementById('gear').onclick = () =>
    document.getElementById('panel').classList.toggle('open');

  document.querySelectorAll('.swatch').forEach(btn => {
    btn.onclick = () => { settings.color = btn.dataset.color; save(); apply(); };
  });

  document.getElementById('size').oninput = (e) => {
    settings.size = Number(e.target.value); save(); apply();
  };

  document.getElementById('format').onclick = () => {
    settings.hour12 = !settings.hour12; save(); apply();
  };

  apply();
  setInterval(tick, 1000);
</script>
</body>
</html>
