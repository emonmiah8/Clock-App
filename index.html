<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<link rel="stylesheet" href="css/style.css?v=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
</head>
<body>
  <div id="time"></div>

  <svg id="analog" viewBox="0 0 200 200" style="display:none">
    <circle cx="100" cy="100" r="95" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5"/>
    <g id="ticks" stroke="currentColor"></g>
    <line id="hourHand" x1="100" y1="100" x2="100" y2="55" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <line id="minHand" x1="100" y1="100" x2="100" y2="30" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <line id="secHand" x1="100" y1="110" x2="100" y2="22" stroke="#ff5252" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="4" fill="currentColor"/>
  </svg>

  <div id="date"></div>

  <button id="gear">⚙</button>

  <div id="panel">
    <div class="row">
      <div class="label">Style</div>
      <button class="btn" id="mode"></button>
    </div>
    <div class="row">
      <div class="label">Color</div>
      <button class="swatch" data-color="#ffffff" style="background:#ffffff"></button>
      <button class="swatch" data-color="#4fc3f7" style="background:#4fc3f7"></button>
      <button class="swatch" data-color="#81c784" style="background:#81c784"></button>
      <button class="swatch" data-color="#ffb74d" style="background:#ffb74d"></button>
      <button class="swatch" data-color="#f06292" style="background:#f06292"></button>
    </div>
    <div class="row">
      <div class="label">Size</div>
      <input type="range" id="size" min="8" max="26" step="1">
    </div>
    <div class="row">
      <div class="label">Time format (digital)</div>
      <button class="btn" id="format"></button>
    </div>
  </div>

<script src="js/main.js?v=1"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
