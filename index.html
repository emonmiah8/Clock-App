<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<style>
  :root { --color: #ffffff; --size: 18vw; }
  body {
    margin: 0;
    height: 100vh;
    background: #000;
    color: var(--color);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
  }
  #time { font-size: var(--size); font-weight: 200; }
  #analog { width: calc(var(--size) * 3.5); height: calc(var(--size) * 3.5); }
  #date { font-size: 5vw; opacity: 0.6; margin-top: 8px; }

  #gear {
    position: fixed; top: 12px; right: 16px;
    background: none; border: none;
    color: #fff; font-size: 28px; opacity: 0.5;
  }
  #panel {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #151515; color: #fff;
    padding: 16px 20px 28px;
    border-radius: 16px 16px 0 0;
  }
  #panel.open { display: block; }
  .row { margin: 16px 0; }
  .label { font-size: 14px; opacity: 0.6; margin-bottom: 8px; }
  .swatch {
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid #444; margin-right: 10px;
  }
  #size { width: 100%; }
  .btn {
    background: #333; color: #fff; border: none;
    padding: 10px 18px; border-radius: 8px; font-size: 16px;
    margin-right: 8px;
  }
</style>
</head>
<body>
  <div id="time"></div>

  <svg id="analog" viewBox="0 0 200 200" style="display:none">
    <circle cx="100" cy="100" r="95" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5"/>
    <g id="ticks" stroke="currentColor"></g>
    <line id="hourHand" x1="100" y1="100" x2="100" y2="55" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <line id="minHand" x1="100" y1="100" x2="100" y2="30" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <line id="secHand" x1="100" y1="110" x2="100" y2="22" stroke="#ff5252" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="4" fill="currentColor"/>
  </svg>

  <div id="date"></div>

  <button id="gear">⚙</button>

  <div id="panel">
    <div class="row">
      <div class="label">Style</div>
      <button class="btn" id="mode"></button>
    </div>
    <div class="row">
      <div class="label">Color</div>
      <button class="swatch" data-color="#ffffff" style="background:#ffffff"></button>
      <button class="swatch" data-color="#4fc3f7" style="background:#4fc3f7"></button>
      <button class="swatch" data-color="#81c784" style="background:#81c784"></button>
      <button class="swatch" data-color="#ffb74d" style="background:#ffb74d"></button>
      <button class="swatch" data-color="#f06292" style="background:#f06292"></button>
    </div>
    <div class="row">
      <div class="label">Size</div>
      <input type="range" id="size" min="8" max="26" step="1">
    </div>
    <div class="row">
      <div class="label">Time format (digital)</div>
      <button class="btn" id="format"></button>
    </div>
  </div>

<script>
  const defaults = { color: '#ffffff', size: 18, hour12: false, mode: 'digital' };
  let settings = { ...defaults };

  try {
    const saved = localStorage.getItem('clockSettings');
    if (saved) settings = { ...defaults, ...JSON.parse(saved) };
  } catch (e) {}

  function save() {
    try { localStorage.setItem('clockSettings', JSON.stringify(settings)); } catch (e) {}
  }

  // Draw the 12 tick marks once
  (function drawTicks() {
    const g = document.getElementById('ticks');
    for (let i = 0; i < 12; i++) {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', 100);
      line.setAttribute('y1', 10);
      line.setAttribute('x2', 100);
      line.setAttribute('y2', i % 3 === 0 ? 24 : 18);
      line.setAttribute('stroke-width', i % 3 === 0 ? 3 : 1.5);
      line.setAttribute('transform', 'rotate(' + (i * 30) + ' 100 100)');
      g.appendChild(line);
    }
  })();

  function apply() {
    const root = document.documentElement.style;
    root.setProperty('--color', settings.color);
    root.setProperty('--size', settings.size + 'vw');
    document.getElementById('size').value = settings.size;

    const analog = settings.mode === 'analog';
    document.getElementById('time').style.display = analog ? 'none' : 'block';
    document.getElementById('analog').style.display = analog ? 'block' : 'none';

    document.getElementById('mode').textContent =
      analog ? 'Analog (tap for Digital)' : 'Digital (tap for Analog)';
    document.getElementById('format').textContent =
      settings.hour12 ? '12-hour (tap for 24)' : '24-hour (tap for 12)';
    tick();
  }

  function rotate(id, deg) {
    document.getElementById(id).setAttribute('transform', 'rotate(' + deg + ' 100 100)');
  }

  function tick() {
    const now = new Date();

    document.getElementById('time').textContent =
      now.toLocaleTimeString('en-GB', { hour12: settings.hour12 }).toUpperCase();

    document.getElementById('date').textContent =
      now.toLocaleDateString('en-GB', {
        weekday: 'long', day: 'numeric', month: 'long'
      });

    const h = now.getHours() % 12;
    const m = now.getMinutes();
    const s = now.getSeconds();
    rotate('hourHand', h * 30 + m * 0.5);
    rotate('minHand', m * 6 + s * 0.1);
    rotate('secHand', s * 6);
  }

  document.getElementById('gear').onclick = () =>
    document.getElementById('panel').classList.toggle('open');

  document.querySelectorAll('.swatch').forEach(btn => {
    btn.onclick = () => { settings.color = btn.dataset.color; save(); apply(); };
  });

  document.getElementById('size').oninput = (e) => {
    settings.size = Number(e.target.value); save(); apply();
  };

  document.getElementById('format').onclick = () => {
    settings.hour12 = !settings.hour12; save(); apply();
  };

  document.getElementById('mode').onclick = () => {
    settings.mode = settings.mode === 'digital' ? 'analog' : 'digital';
    save(); apply();
  };

  apply();
  setInterval(tick, 1000);
</script>
</body>
</html>
