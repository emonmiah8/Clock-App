<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:"ClockNum";src:url("digits.ttf") format("truetype");font-weight:100 900;unicode-range:U+0030-0039}
:root{--sf:"ClockNum","Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
body,svg text{font-family:var(--sf)!important}
*{font-weight:800!important}
.wgt{position:absolute;inset:0;container-type:size;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff}
.wgt.bg{background:#1c1d24;border-radius:15vmin}
.wgt svg{display:block;overflow:visible}
.wcol{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%}
.wrow{display:flex;align-items:center;justify-content:center}
.wcg{display:grid;grid-template-columns:repeat(7,1fr);font-size:5.6cqmin;text-align:center;row-gap:1.4cqmin}
.wcg i{font-style:normal;opacity:.55;padding-bottom:1cqmin}
.wcg span{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
</style>
<script src="js/designs.js"></script>
</head>
<body>
<script>
/* Home screen widget page: draws one design from js/designs.js.
   Query: wg = design id, tr = 1 for a transparent background, fmt = 24 | 12,
   ev = upcoming dates [{d,n}] sent by the app, t = token for the native side. */
const q = new URLSearchParams(location.search);
const globalSet = { wgFmt: q.get('fmt') === '12' ? '12' : '24' };
let EV = [];
try { EV = JSON.parse(q.get('ev') || '[]'); } catch (e) {}

// small helpers that js/designs.js expects from the app
function pad(n) { return String(n).padStart(2, '0'); }
function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function detectCountry() { return ''; }
function getUpcoming(today) {
  return EV.map(function (e) {
    const p = String(e.d).split('-');
    return { n: e.n, diff: Math.round((new Date(+p[0], +p[1] - 1, +p[2]) - today) / 864e5) };
  }).filter(function (e) { return e.diff >= 0; });
}

const tile = document.createElement('div');
tile.className = 'wgt' + (q.get('tr') === '1' ? '' : ' bg');
tile.innerHTML = (WGM[q.get('wg')] || WGM.blob).h(new Date());
document.body.appendChild(tile);

// fonts come from Google Fonts when online; the widget is drawn after they load (or after 2.5 s)
const link = document.createElement('link');
link.rel = 'stylesheet';
link.href = 'https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Permanent+Marker&family=Playfair+Display:wght@800;900&display=swap';
document.head.appendChild(link);

const wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
Promise.race([
  Promise.all(['800 20px Poppins', '20px "Permanent Marker"', '800 20px "Playfair Display"'].map(function (f) {
    return document.fonts.load(f, '0123456789ABC').catch(function () {});
  })),
  wait(2500)
]).then(function () { return wait(150); }).then(function () {
  if (window.Native) Native.ready(q.get('t'));
});
</script>
</body>
</html>
