name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # Local Notifications plugin (same major version as @capacitor/core)
      - name: Add Local Notifications plugin
        run: |
          MAJOR=$(node -p "const p=require('./package.json');const v=(p.dependencies||{})['@capacitor/core']||(p.devDependencies||{})['@capacitor/core']||'';v.replace(/[^0-9.]/g,'').split('.')[0]")
          npm install @capacitor/local-notifications@${MAJOR:-latest}

      - name: Copy web files to www
        run: |
          rm -rf www
          mkdir www
          cp -r index.html css js manifest.json digits.ttf icon-192.png icon-512.png sw.js sw-notify.js www/

      - name: Sync Capacitor
        run: npx cap sync android

      # alarm permissions are added to the Android manifest during the build
      - name: Add Android permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM USE_FULL_SCREEN_INTENT WAKE_LOCK VIBRATE RECEIVE_BOOT_COMPLETED; do
            grep -q "android.permission.$P" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" $M
          done

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clock-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apkapk
